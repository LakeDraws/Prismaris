            displayName = Dyre
            description = Dyre is a potentially habitable "snowball planet" on a highly eccentric orbit compared to its neighbors. It is slightly smaller than Kerbin and has an average surface temperature of roughly -78°C. Despite this extreme cold, Dyre still posesses water oceans that resist freezing over on account of their extreme salinity. Most plant life on Dyre can be found in the form of lichens that bury themselves beneath the snow, though Dyre's immense blizzards can sometimes bury them under too much snow. Because of the permafrost, erosion on Dyre is extremely slow, and, should a region lose its permafrost, it is susceptable to becoming highly unstable.

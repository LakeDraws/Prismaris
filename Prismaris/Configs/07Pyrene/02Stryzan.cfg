        Properties
        {
            displayName = Stryzan
            description = Stryzan is perhaps one of the most interesting bodies in the entire Prima system. By all standards, it should not have any water on its surface at this distance from Prima, but a few factors allow it to keep high enough temperatures to avoid being yet another snowball drifting through space. Stryzan is in a 1:2:4 orbital resonance with Treb and Galera, which helps to maintain its rather high 0.05 eccentricity. This environment also allows Stryzan to experience active volcanism which helps to keep the atmosphere thick enough for liquid water to exist. Current views of Stryzan indicate it may have a habitable band on its coast lines, as straying too far from the water would be detrimental for any plant life, given that the moon is tidally locked and therefore most of the water is pulled towards Pyrene, though a few lakes still remain.
